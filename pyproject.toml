[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "repoprover"
version = "0.1.0"
description = "Automatic formalization of math books and papers in Lean"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "fastapi",
    "uvicorn",
    "websockets",
    "simple-parsing",
    "pyyaml",
    "pytest",
    "pyzmq",
]

[project.optional-dependencies]
analysis = [
    "matplotlib",
    "numpy",
]

[project.scripts]
repoprover = "repoprover.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E501 is ignored: prompt strings embed long prose that ruff format cannot split.
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
